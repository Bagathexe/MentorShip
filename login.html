<!DOCTYPE html>
<html>
    <head>
        <title>SIET-Inventory Management</title>
        <link rel="shortcut icon" href="../MentorShip/mclogo.png">
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <div class="main">
            <div class="logo-container">
                <img src="../MentorShip/banner.png" alt="MentorConnect Logo">
            </div>
            <div class="form" >
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required><br>
                <a class="rmb" href="#">Forgot Your Username Or Password?</a><br>
                <div class="checkbox-container">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Remember username</label>
                </div><br>
                <button onclick="window.location.href='index.html'" class="button"><a href="#">Log in</a></button>
            </div>
        </div>
    </body>
</html>
