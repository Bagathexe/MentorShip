<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Mentor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Become a Mentor</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="find-mentor.html">Find a Mentor</a></li>
                <li><a href="become-mentor.html">Become a Mentor</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <section class="mentor-form">
        <form action="#">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required>

            <label for="field">Field of Expertise</label>
            <input type="text" id="field" name="field" placeholder="Your field of expertise" required>

            <label for="experience">Years of Experience</label>
            <input type="number" id="experience" name="experience" placeholder="Your experience in years" required>

            <button type="submit">Submit</button>
        </form>
    </section>

    <footer>
        <p>© 2024 Mentorship Platform. All rights reserved.</p>
    </footer>
</body>
</html>
