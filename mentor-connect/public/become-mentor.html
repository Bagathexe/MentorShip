<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Mentor</title>
    <link rel="stylesheet" href="../src/css/style2.css">
</head>
<body>
    <header>
        <img src="../src/assets/Logo.png" alt="Mentorship Logo" class="logo">
        <h1>Become a Mentor</h1>
        <nav>
            <ul>
                <li><a href="../public/index.html">Home</a></li>
                <li><a href="../public/find-mentor.html">Find a Mentor</a></li>
                <li><a href="../public/become-mentor.html">Become a Mentor</a></li>
                <li><a href="../public/contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <section class="mentor-form">
        <h2>Share your expertise and guide the next generation</h2>
        <form action="" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="expertise">Area of Expertise</label>
            <input type="text" id="expertise" name="expertise" required>

            <label for="bio">Short Bio</label>
            <textarea id="bio" name="bio" rows="4" required></textarea>

            <label for="linkedin">LinkedIn Profile</label>
            <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/your-profile">

            <button type="submit">Become a Mentor</button>
        </form>
    </section>

    <footer>
        <p>© 2024 Mentorship Platform. All rights reserved.</p>
    </footer>
</body>
</html>
